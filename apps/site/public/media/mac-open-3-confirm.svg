<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="img" aria-labelledby="t">
  <title id="t">Drawing of the macOS question Open “LernLab”?, with the Open Anyway button marked, then a password box</title>
  <style>
    .desk{fill:#F1EDE7}.panel{fill:#FFFFFF;stroke:#E4DED6}.ink{fill:#1F1D1A}.muted{fill:#5C574F}
    .btn{fill:#F1EDE7;stroke:#8A847B}.field{fill:#FAF8F5;stroke:#8A847B}
    .mark{fill:none;stroke:#2F5BB7;stroke-width:3}.badge{fill:#2F5BB7}.on{fill:#FFFFFF}.icon{fill:#2F5BB7}
    text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
    @media (prefers-color-scheme: dark){
      .desk{fill:#1A1917}.panel{fill:#24221F;stroke:#3A3732}.ink{fill:#ECE9E4}.muted{fill:#A8A39B}
      .btn{fill:#2D2B27;stroke:#807B73}.field{fill:#1A1917;stroke:#807B73}
      .mark{stroke:#8FA8F0}.badge{fill:#8FA8F0}.on{fill:#1A1917}.icon{fill:#8FA8F0}
    }
  </style>
  <rect class="desk" width="480" height="300" rx="12"/>
  <rect class="panel" x="20" y="22" width="250" height="256" rx="14"/>
  <rect class="icon" x="125" y="38" width="40" height="40" rx="9"/>
  <path class="on" d="M138 48h5v15h10v5h-15z"/>
  <text class="ink" x="145" y="100" font-size="15" font-weight="700" text-anchor="middle">Open “LernLab”?</text>
  <text class="muted" x="145" y="122" font-size="11" text-anchor="middle">Apple is not able to verify that it is free</text>
  <text class="muted" x="145" y="137" font-size="11" text-anchor="middle">of malware. Only open it if you trust</text>
  <text class="muted" x="145" y="152" font-size="11" text-anchor="middle">where it came from.</text>
  <rect class="btn" x="38" y="170" width="214" height="30" rx="8"/>
  <text class="ink" x="145" y="190" font-size="13" font-weight="700" text-anchor="middle">Open Anyway</text>
  <rect class="btn" x="38" y="208" width="214" height="30" rx="8"/>
  <text class="ink" x="145" y="228" font-size="13" text-anchor="middle">Done</text>
  <rect class="mark" x="32" y="164" width="226" height="42" rx="11"/>
  <circle class="badge" cx="20" cy="185" r="14"/>
  <text class="on" x="20" y="190" font-size="14" font-weight="700" text-anchor="middle">3</text>
  <rect class="panel" x="290" y="86" width="172" height="150" rx="14"/>
  <text class="ink" x="376" y="114" font-size="13" font-weight="700" text-anchor="middle">Privacy &amp; Security</text>
  <text class="muted" x="376" y="134" font-size="11" text-anchor="middle">Enter your password</text>
  <text class="muted" x="376" y="149" font-size="11" text-anchor="middle">to allow this.</text>
  <rect class="field" x="306" y="162" width="140" height="26" rx="6"/>
  <text class="ink" x="318" y="180" font-size="13">••••••••</text>
  <rect class="btn" x="306" y="196" width="140" height="28" rx="8"/>
  <text class="ink" x="376" y="215" font-size="12" font-weight="700" text-anchor="middle">Modify Settings</text>
  <path class="mark" d="M262 185q16 0 26-20"/>
</svg>
