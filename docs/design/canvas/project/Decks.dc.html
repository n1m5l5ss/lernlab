<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LernLab — Decks</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 100%; height: 800px; display: flex; flex-wrap: wrap; background: {{t.bg}}; color: {{t.text}}; font-family: 'Atkinson Hyperlegible Next', 'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif; box-sizing: border-box; overflow: hidden">
  <nav aria-label="Main" style="width: 232px; flex: 1 1 232px; max-width: 232px; border-right: 1px solid {{t.border}}; padding: 24px 16px; display: flex; flex-direction: column; gap: 4px; box-sizing: border-box">
    <div style="font-size: 20px; font-weight: 700; padding: 8px 12px 24px; letter-spacing: 0.01em">LernLab</div>
    <a href="Main.dc.html" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 6px; color: {{t.text}}; font-size: 16px; text-decoration: none">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"></path><path d="M5 10v10h14V10"></path></svg>Home</a>
    <a href="Decks.dc.html" aria-current="page" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 6px; background: {{t.accentTint}}; color: {{t.accent}}; font-weight: 700; font-size: 16px; text-decoration: none">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="7" width="16" height="13" rx="2"></rect><path d="M7 4h10"></path></svg>Decks</a>
    <a href="#cards" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 6px; color: {{t.text}}; font-size: 16px; text-decoration: none">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"></path></svg>Cards</a>
    <a href="#progress" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 6px; color: {{t.text}}; font-size: 16px; text-decoration: none">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg>Progress</a>
    <div style="flex-grow: 1"></div>
    <a href="#settings" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 6px; color: {{t.muted}}; font-size: 16px; text-decoration: none">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"></path></svg>Settings</a>
  </nav>
  <main style="flex: 999 1 560px; min-width: 0; padding: 56px 48px; box-sizing: border-box; overflow: auto">
    <div style="max-width: 960px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px">
      <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
        <h1 style="margin: 0; font-size: 31px; line-height: 1.25; font-weight: 700">Decks</h1>
        <div style="display: flex; gap: 12px">
          <button type="button" style="height: 44px; padding: 0 20px; border-radius: 6px; border: 1px solid {{t.border}}; background: {{t.surface}}; color: {{t.text}}; font: inherit; font-size: 16px; cursor: pointer">Import</button>
          <button type="button" style="height: 44px; padding: 0 20px; border-radius: 6px; border: 0; background: {{t.accent}}; color: {{t.onAccent}}; font: inherit; font-size: 16px; font-weight: 700; cursor: pointer">New deck</button>
        </div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
        <sc-for list="{{decks}}" as="d" hint-placeholder-count="3">
          <article style="background: {{t.surface}}; border: 1px solid {{t.border}}; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 16px">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px">
              <div style="display: flex; flex-direction: column; gap: 4px">
                <h2 style="margin: 0; font-size: 20px; font-weight: 700">{{d.name}}</h2>
                <span style="font-size: 13px; color: {{t.muted}}">{{d.kind}}</span>
              </div>
              <button type="button" aria-label="Deck options" style="width: 44px; height: 44px; border-radius: 6px; border: 0; background: transparent; color: {{t.muted}}; cursor: pointer">
                <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg>
              </button>
            </div>
            <div style="display: flex; gap: 24px; font-size: 16px">
              <span><strong>{{d.due}}</strong> <span style="color: {{t.muted}}">due</span></span>
              <span><strong>{{d.fresh}}</strong> <span style="color: {{t.muted}}">new</span></span>
              <span><strong>{{d.known}}</strong> <span style="color: {{t.muted}}">known of {{d.total}}</span></span>
            </div>
            <div style="height: 6px; border-radius: 999px; background: {{t.subtle}}"><div style="{{d.bar}}"></div></div>
            <a href="Session.dc.html" style="align-self: flex-start; display: flex; align-items: center; height: 44px; padding: 0 20px; border-radius: 6px; border: 1px solid {{t.border}}; color: {{t.text}}; font-size: 16px; font-weight: 700; text-decoration: none">{{d.action}}</a>
          </article>
        </sc-for>
        <div style="border: 2px dashed {{t.border}}; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 8px; text-align: center; min-height: 220px; box-sizing: border-box">
          <svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="{{t.muted}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4M7 9l5-5 5 5M4 20h16"></path></svg>
          <span style="font-size: 16px; font-weight: 700">Drop a deck file here</span>
          <span style="font-size: 13px; color: {{t.muted}}">CSV, Anki .apkg, or a LernLab deck zip</span>
          <a href="#template" style="font-size: 13px; color: {{t.accent}}">Download the CSV template</a>
        </div>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    var L = { bg: '#FAF8F5', surface: '#FFFFFF', text: '#1F1D1A', muted: '#5C574F', accent: '#2F5BB7', onAccent: '#FFFFFF', border: '#E4DED6', subtle: '#F1EDE7', accentTint: 'rgba(47,91,183,0.10)' };
    var D = { bg: '#1A1917', surface: '#24221F', text: '#ECE9E4', muted: '#A8A39B', accent: '#8FA8F0', onAccent: '#1A1917', border: '#3A3732', subtle: '#2D2B27', accentTint: 'rgba(143,168,240,0.14)' };
    var t = (this.props.theme ?? 'light') === 'dark' ? D : L;
    var rows = [
      { name: 'German A1 starter', kind: 'Language · German', due: 24, fresh: 10, known: 812, total: '2,400', pct: 34, action: 'Study' },
      { name: 'AWS Cloud Practitioner', kind: 'Subject · 300 cards', due: 6, fresh: 15, known: 140, total: '300', pct: 47, action: 'Study' },
      { name: 'Biology: the cell', kind: 'Subject · 60 cards', due: 0, fresh: 0, known: 60, total: '60', pct: 100, action: 'Practice' }
    ];
    var decks = rows.map(function (r) {
      return Object.assign({}, r, { bar: 'width: ' + r.pct + '%; height: 6px; border-radius: 999px; background: ' + t.accent });
    });
    return { t: t, decks: decks };
  }
}
</script>
</body>
</html>
