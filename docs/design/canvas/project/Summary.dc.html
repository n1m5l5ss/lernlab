<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LernLab — Block summary</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 100%; height: 800px; display: flex; align-items: center; justify-content: center; padding: 48px; box-sizing: border-box; background: {{t.bg}}; color: {{t.text}}; font-family: 'Atkinson Hyperlegible Next', 'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif">
  <main style="width: 100%; max-width: 720px; display: flex; flex-direction: column; gap: 24px">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 16px; color: {{t.muted}}">Block complete · 6 min</span>
      <h1 style="margin: 0; font-size: 39px; line-height: 1.2; font-weight: 700">12 of 15 recalled</h1>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px">
      <div style="background: {{t.surface}}; border: 1px solid {{t.border}}; border-radius: 12px; padding: 20px 24px; display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 25px; font-weight: 700">4</span>
        <span style="font-size: 16px; color: {{t.muted}}">new words started</span>
      </div>
      <div style="background: {{t.surface}}; border: 1px solid {{t.border}}; border-radius: 12px; padding: 20px 24px; display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 25px; font-weight: 700">+140 XP</span>
        <div style="height: 8px; border-radius: 999px; background: {{t.subtle}}"><div style="width: 92%; height: 8px; border-radius: 999px; background: {{t.accent}}"></div></div>
        <span style="font-size: 13px; color: {{t.muted}}">40 XP to level 7</span>
      </div>
      <div style="background: {{t.surface}}; border: 1px solid {{t.border}}; border-radius: 12px; padding: 20px 24px; display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 25px; font-weight: 700">5 of 7</span>
        <span style="font-size: 16px; color: {{t.muted}}">days this week</span>
      </div>
    </div>
    <section aria-label="Cards to look at again" style="background: {{t.surface}}; border: 1px solid {{t.border}}; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 12px">
      <h2 style="margin: 0; font-size: 16px; font-weight: 700">These 3 come back tomorrow</h2>
      <sc-for list="{{missed}}" as="m" hint-placeholder-count="3">
        <div style="display: flex; justify-content: space-between; gap: 16px; padding: 10px 0; border-top: 1px solid {{t.border}}">
          <span lang="de" style="font-size: 20px; font-weight: 700">{{m.word}}</span>
          <span style="font-size: 16px; color: {{t.muted}}">{{m.meaning}}</span>
        </div>
      </sc-for>
    </section>
    <div style="display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 16px">
      <a href="Session.dc.html" style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 28px; border-radius: 6px; border: 1px solid {{t.border}}; color: {{t.text}}; font-size: 20px; text-decoration: none">One more round <span style="font-size: 13px; color: {{t.muted}}">Space</span></a>
      <a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 32px; border-radius: 6px; background: {{t.accent}}; color: {{t.onAccent}}; font-size: 20px; font-weight: 700; text-decoration: none">Done <span style="font-size: 13px; font-weight: 400; opacity: 0.85">Enter</span></a>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    var L = { bg: '#FAF8F5', surface: '#FFFFFF', text: '#1F1D1A', muted: '#5C574F', accent: '#2F5BB7', onAccent: '#FFFFFF', border: '#E4DED6', subtle: '#F1EDE7' };
    var D = { bg: '#1A1917', surface: '#24221F', text: '#ECE9E4', muted: '#A8A39B', accent: '#8FA8F0', onAccent: '#1A1917', border: '#3A3732', subtle: '#2D2B27' };
    var t = (this.props.theme ?? 'light') === 'dark' ? D : L;
    return {
      t: t,
      missed: [
        { word: 'der Hund', meaning: 'the dog' },
        { word: 'das Fenster', meaning: 'the window' },
        { word: 'die Brücke', meaning: 'the bridge' }
      ]
    };
  }
}
</script>
</body>
</html>
