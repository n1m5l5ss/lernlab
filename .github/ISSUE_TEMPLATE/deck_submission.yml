name: Deck submission
description: Share a deck for the example decks or the future deck gallery
labels: ['deck']
body:
  - type: input
    id: name
    attributes:
      label: Deck name and subject
    validations:
      required: true
  - type: textarea
    id: file
    attributes:
      label: Deck file
      description: Attach a .lernpack, CSV or zip.
    validations:
      required: true
  - type: checkboxes
    id: rights
    attributes:
      label: Rights
      options:
        - label: I wrote these cards myself or they are openly licensed, and I agree to share them under CC BY 4.0 or CC0.
          required: true
        - label: The deck contains no copyrighted exam questions.
          required: true
