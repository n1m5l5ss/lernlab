name: Beta release

# Run by hand on `dev` (Actions → Beta release → Run workflow).
# Tags vX.Y.Z-beta.N on the current dev commit, publishes a GitHub pre-release
# and attaches installers for all three systems.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version the beta leads up to, e.g. 0.3.0. Default: next patch after the last release.'
        type: string
        required: false

permissions:
  contents: read

jobs:
  tag:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions: { contents: write }
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - id: next
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          base="$INPUT_VERSION"
          if [ -z "$base" ]; then
            last=$(node -p "require('./.release-please-manifest.json')['.']")
            base=$(node -e "const [a,b,c]=process.argv[1].split('.').map(Number);console.log([a,b,c+1].join('.'))" "$last")
          fi
          if ! echo "$base" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then echo "Bad version: $base" >&2; exit 1; fi
          n=$(( $(git tag -l "v$base-beta.*" | sed 's/.*-beta\.//' | sort -n | tail -1 || echo 0) + 1 ))
          echo "tag=v$base-beta.$n" >> "$GITHUB_OUTPUT"
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.next.outputs.tag }}
        run: gh release create "$TAG" --prerelease --target "$GITHUB_SHA" --title "$TAG" --generate-notes --repo "$GITHUB_REPOSITORY"

  installers:
    needs: tag
    permissions:
      contents: write
      # Windows signing (SignPath) reads the build's artifacts.
      actions: read
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    # SignPath secret and variables (#39, docs/CODE_SIGNING.md); without them Windows builds unsigned.
    secrets: inherit
