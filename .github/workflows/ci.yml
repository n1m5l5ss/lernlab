name: ci
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  # Pull requests opened by workflows (release-please, the main -> dev sync) don't trigger
  # pull_request runs, so those workflows start this one by hand on the PR's branch.
  workflow_dispatch:
permissions:
  contents: read
# A newer push to the same PR or branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build:electron
      # End-to-end (#40) with axe (#35): Playwright clicks through the app just built (apps/desktop/e2e).
      # Linux runners have no screen, so xvfb lends one.
      - name: End-to-end tests
        timeout-minutes: 10
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a npm run e2e --workspace apps/desktop
          else
            npm run e2e --workspace apps/desktop
          fi
      - name: Keep the end-to-end screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots-${{ matrix.os }}
          path: apps/desktop/e2e-results/
          if-no-files-found: ignore
      # Added by later tickets: coverage gate (#6), visual (#2/#11), performance comparison (#54).
