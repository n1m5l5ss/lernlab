name: ci
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  # Pull requests opened by workflows (release-please, the main -> dev sync) don't trigger
  # pull_request runs, so those workflows start this one by hand on the PR's branch.
  workflow_dispatch:
permissions:
  contents: read
# A newer push to the same PR or branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      # Coverage of the engine (packages/core); fails below the floor in docs/TESTING.md. Once is enough.
      - if: runner.os == 'Linux'
        run: npm run coverage
      - run: npm run build:electron
      # End-to-end (#40) with axe (#35): Playwright clicks through the app just built (apps/desktop/e2e).
      # Linux runners have no screen, so xvfb lends one.
      - name: End-to-end tests
        timeout-minutes: 10
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a npm run e2e --workspace apps/desktop
          else
            npm run e2e --workspace apps/desktop
          fi
      - name: Keep the end-to-end screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-screenshots-${{ matrix.os }}
          path: apps/desktop/e2e-results/
          if-no-files-found: ignore
      # Visual checks are visual.yml, performance perf.yml, nightly fuzzing fuzz.yml.
