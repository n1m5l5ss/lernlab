name: Build installers

# Runs three ways:
# - called by release-please.yml right after it creates a release (its tag is made with GITHUB_TOKEN,
#   and such tags never trigger `on: push: tags`, so release-please calls this workflow directly);
#   beta.yml calls it the same way for pre-releases;
# - on a tag vX.Y.Z pushed by a person: a draft GitHub Release to review before publishing;
# - by hand (Actions → Build installers → Run workflow): builds artifacts only, or, with a tag,
#   rebuilds that release's installers and attaches them (e.g. after a failed run).
#
# Every installer is installed (or mounted) on its own system and started with --smoke-test, which
# passes only once Home is on screen (apps/desktop/electron/smoke.ts).
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and attach installers to, e.g. v0.2.1
        type: string
        required: true
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Optional. An existing release tag to build and attach installers to, e.g. v0.3.0
        type: string
        required: false

permissions:
  contents: read

env:
  # The tag to build: the input when called, otherwise the pushed ref.
  REF: ${{ inputs.tag || github.ref }}
  # The release tag (empty for a plain build by hand from a branch).
  TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { ref: '${{ env.REF }}' }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24, cache: npm }
      - run: npm ci
      # Fail fast on a tag that doesn't match package.json (see apps/desktop/electron/release-version.ts).
      - if: env.TAG != ''
        run: npx tsx apps/desktop/electron/release-version.ts "$TAG"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  build:
    needs: test
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
          - os: windows-latest
            script: dist:win
          - os: ubuntu-latest
            script: dist:linux
    runs-on: ${{ matrix.os }}
    env:
      # 'true' once the owner has added SignPath's token and organisation (docs/CODE_SIGNING.md).
      SIGN_WINDOWS: ${{ secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
    permissions:
      contents: read
      # The SignPath action reads this job's details and its uploaded artifacts.
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { ref: '${{ env.REF }}' }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24, cache: npm }
      - run: npm ci
      # Installer names and the in-app version come from package.json; match the tag being built
      # (a beta tag leads up to the next version, so its number is newer than package.json).
      - if: env.TAG != ''
        shell: bash
        run: |
          version=$(npx tsx apps/desktop/electron/release-version.ts "$TAG")
          npm pkg set "version=$version" --workspace apps/desktop
      # Code signing (#39, docs/CODE_SIGNING.md). macOS is ad-hoc signed by electron-builder (free, no
      # Apple certificate). Windows is signed by SignPath Foundation, only once the SIGNPATH_API_TOKEN
      # secret and the SIGNPATH_ORGANIZATION_ID variable exist; until then it builds unsigned as before.
      - if: runner.os != 'Windows' || env.SIGN_WINDOWS != 'true'
        run: npm run ${{ matrix.script }}

      # ── Windows, signed: build the app folder, sign LernLab.exe, build the installer from the signed
      #    folder, sign the installer, then point latest.yml at the signed file (auto-update checks its sha512).
      - name: Build the Windows app folder to sign
        if: runner.os == 'Windows' && env.SIGN_WINDOWS == 'true'
        working-directory: apps/desktop
        run: |
          npm run build:electron
          npx electron-builder --win --dir --publish never
      - id: unsigned-app
        if: runner.os == 'Windows' && env.SIGN_WINDOWS == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: unsigned-app-windows, path: release/win-unpacked/, if-no-files-found: error, retention-days: 1 }
      - name: Sign LernLab.exe (SignPath)
        if: runner.os == 'Windows' && env.SIGN_WINDOWS == 'true'
        uses: signpath/github-action-submit-signing-request@a2c5b60d9c75f073142b653c354b632eedce097b # v3.2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'lernlab' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          # Release signing waits for an approver to accept the request in SignPath.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: release/win-signed
      - name: Build the installer from the signed app
        if: runner.os == 'Windows' && env.SIGN_WINDOWS == 'true'
        working-directory: apps/desktop
        shell: bash
        run: npx electron-builder --win --prepackaged "$GITHUB_WORKSPACE/release/win-signed" --publish never
      - id: unsigned-installer
        if: runner.os == 'Windows' && env.SIGN_WINDOWS == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          { name: unsigned-installer-windows, path: release/*-Setup-*.exe, if-no-files-found: error, retention-days: 1 }
      - name: Sign the installer (SignPath)
        if: runner.os == 'Windows' && env.SIGN_WINDOWS == 'true'
        uses: signpath/github-action-submit-signing-request@a2c5b60d9c75f073142b653c354b632eedce097b # v3.2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'lernlab' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: release/installer-signed
      - name: Put the signed installer in place and update latest.yml
        if: runner.os == 'Windows' && env.SIGN_WINDOWS == 'true'
        shell: bash
        run: npx tsx apps/desktop/electron/signed-installer.ts release/installer-signed release
      - name: Check the signatures
        if: runner.os == 'Windows' && env.SIGN_WINDOWS == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($f in @((Get-ChildItem release/*-Setup-*.exe), (Get-Item release/win-signed/LernLab.exe))) {
            $s = Get-AuthenticodeSignature $f.FullName
            Write-Host "$($f.Name): $($s.Status) $($s.SignerCertificate.Subject)"
            if ($s.Status -ne 'Valid') { throw "$($f.Name) is not validly signed" }
          }

      # ── Smoke tests: install each installer the way a user would, start it, wait for Home. ──
      - name: Smoke test (Linux AppImage and deb)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          # Chromium's sandbox needs a setuid helper or user namespaces; CI runners allow neither.
          app=$(ls release/*.AppImage)
          chmod +x "$app"
          xvfb-run -a "$app" --appimage-extract-and-run --no-sandbox --smoke-test | tee smoke.log
          grep -q LERNLAB_SMOKE_OK smoke.log
          sudo apt-get install -y ./release/*.deb
          xvfb-run -a /opt/LernLab/lernlab --no-sandbox --smoke-test | tee smoke.log
          grep -q LERNLAB_SMOKE_OK smoke.log
      - name: Smoke test (macOS dmg, Apple Silicon and Intel)
        if: runner.os == 'macOS'
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          # The runner is Apple Silicon; the Intel build runs under Rosetta 2.
          arch -x86_64 /usr/bin/true 2>/dev/null || sudo softwareupdate --install-rosetta --agree-to-license
          for arch in arm64 x64; do
            dmg=$(ls release/*-"$arch".dmg)
            hdiutil attach -nobrowse -readonly -mountpoint "/Volumes/lernlab-$arch" "$dmg"
            # Ad-hoc signed as a whole (docs/CODE_SIGNING.md); a broken signature reads as "damaged".
            codesign --verify --deep --strict "/Volumes/lernlab-$arch/LernLab.app"
            codesign -dv "/Volumes/lernlab-$arch/LernLab.app" 2>&1 | grep -q 'Signature=adhoc'
            "/Volumes/lernlab-$arch/LernLab.app/Contents/MacOS/LernLab" --smoke-test | tee smoke.log
            grep -q LERNLAB_SMOKE_OK smoke.log
            hdiutil detach "/Volumes/lernlab-$arch"
          done
      - name: Smoke test (Windows installer, per user)
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Get-ChildItem release/*.exe | Select-Object -First 1).FullName
          Start-Process -Wait -FilePath $setup -ArgumentList '/S'
          # A per-user install lands in %LOCALAPPDATA%\Programs, never in Program Files.
          $app = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter LernLab.exe | Select-Object -First 1
          if (-not $app) { throw 'LernLab.exe is not in %LOCALAPPDATA%\Programs: not a per-user install' }
          $p = Start-Process -Wait -PassThru -FilePath $app.FullName -ArgumentList '--smoke-test' `
            -RedirectStandardOutput smoke.log -RedirectStandardError smoke.err
          Get-Content smoke.log, smoke.err
          if ($p.ExitCode -ne 0 -or -not (Select-String -Quiet LERNLAB_SMOKE_OK smoke.log)) { throw 'Smoke test failed' }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lernlab-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error

  release:
    needs: build
    if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { path: artifacts, merge-multiple: true }
      # Called by release-please or the beta workflow: the GitHub Release already exists, so attach to it.
      - if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" artifacts/* --clobber --repo "$GITHUB_REPOSITORY"
      # A tag pushed by a person: make a draft release to review before publishing.
      - if: inputs.tag == ''
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: artifacts/*
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          generate_release_notes: true
