name: release-please
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    outputs:
      released: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # A PR opened with GITHUB_TOKEN doesn't trigger pull_request workflows, so start the required
      # checks on it by hand (workflow_dispatch is the exception GITHUB_TOKEN may trigger).
      # Not after a release: then `pr` is the merged release PR, whose branch is already gone.
      # Never fail the job over it, or the installers would be skipped. Step `env` is evaluated even
      # when `if` is false, so fromJSON needs a fallback: after a release `pr` is empty, and
      # fromJSON('') fails the whole job (that skipped the 1.0.0 installers).
      - if: steps.rp.outputs.pr && steps.rp.outputs.release_created != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ fromJSON(steps.rp.outputs.pr || '{}').headBranchName }}
          PR: ${{ fromJSON(steps.rp.outputs.pr || '{}').number }}
        run: |
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
          gh workflow run pr-title.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH" -f pr="$PR"
  installers:
    # Tags created with GITHUB_TOKEN don't trigger other workflows, so build the installers from here.
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    permissions:
      contents: write
      # Windows signing (SignPath) reads the build's artifacts.
      actions: read
      # Build provenance for the installers (release.yml).
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag }}
    # SignPath secret and variables (#39, docs/CODE_SIGNING.md); without them Windows builds unsigned.
    secrets: inherit
  sync-dev:
    # Keep dev up to date with version bumps, changelog and hotfixes on main.
    # Opens a pull request main -> dev (rulesets block direct pushes to dev).
    needs: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create --repo "$GITHUB_REPOSITORY" --base dev --head main --title "chore: sync main into dev" \
            --body "Automatic: brings release and hotfix commits from main back into dev." || echo "PR already open or nothing to sync"
          # The push to main already ran ci.yml on this commit; only the title check needs starting.
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --base dev --head main --state open --json number --jq '.[0].number')
          if [ -n "$pr" ]; then gh workflow run pr-title.yml --repo "$GITHUB_REPOSITORY" --ref main -f pr="$pr"; fi
