# Performance budgets (#54, docs/TESTING.md "Performance budgets").
# - Pull requests into dev: this branch against dev on the same Linux runner, interleaved runs, medians.
#   Fails on a regression over +15% (database) or +25% (startup) and posts one table comment on the PR.
# - Nightly on Windows, macOS and Linux: the absolute budgets (P50 and P95), in the job summary.
name: perf
on:
  pull_request:
    branches: [dev]
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compare:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { path: head }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: '${{ github.base_ref }}', path: base }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            head/package-lock.json
            base/package-lock.json
      - name: Install and build both checkouts
        run: |
          for side in base head; do
            (cd $side && npm ci && npm run build:electron)
          done
      - name: Compare this branch with dev
        id: compare
        working-directory: head
        run: |
          set +e
          xvfb-run -a npx tsx --no-warnings bench/compare.ts --base ../base --runs 5 --launches 3 --startup --md ../perf.md
          echo "status=$?" >> "$GITHUB_OUTPUT"
      - name: Job summary
        if: always()
        run: '[ -f perf.md ] && cat perf.md >> "$GITHUB_STEP_SUMMARY" || true'
      # Pull requests from forks get a read-only token: their table is in the job summary only.
      - name: Post or update the PR comment
        if: always() && hashFiles('perf.md') != '' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const body = require('fs').readFileSync('perf.md', 'utf8');
            const marker = body.split('\n')[0];
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find((c) => c.body?.startsWith(marker));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
      - name: Fail on a regression over the limit
        if: steps.compare.outputs.status != '0'
        run: exit 1

  budgets:
    if: github.event_name != 'pull_request'
    name: budgets (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run build:electron
      - name: Measure against the budgets
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a npm run bench:budgets -- --out "$PWD/perf-results.json"
          else
            npm run bench:budgets -- --out "$PWD/perf-results.json"
          fi
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-${{ matrix.os }}
          path: perf-results.json
          if-no-files-found: ignore
