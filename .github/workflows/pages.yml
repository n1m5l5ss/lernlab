name: Website

# Builds the landing page (apps/site) and publishes it on GitHub Pages (issue #41).
# Runs when the website changes on main, after each release (so the download links name the new
# installers), or by hand (Actions → Website → Run workflow).
# One-time setup: Settings → Pages → Source: "GitHub Actions", and let `main` deploy to the
# github-pages environment (Settings → Environments → github-pages → Deployment branches).
on:
  push:
    branches: [main]
    paths:
      - 'apps/site/**'
      - 'packages/ui/tokens.css'
      - 'apps/desktop/package.json'
      - 'package.json'
      - '.github/workflows/pages.yml'
  # A release made by release-please builds its installers inside the release-please run; a tag pushed
  # by hand runs "Build installers" on its own. Either way the newest release may have changed.
  workflow_run:
    workflows: [release-please, Build installers]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; never cancel one halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write # configure-pages reads (and if needed turns on) the Pages settings
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm test --workspace apps/site
      # The newest published release (drafts and pre-releases are skipped), so each button links to a
      # file that exists. Before the first release, the links follow the version in package.json.
      - name: Read the newest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release view --repo "$GITHUB_REPOSITORY" --json tagName,assets > release.json || rm -f release.json
      - run: npm run build --workspace apps/site -- --release "$GITHUB_WORKSPACE/release.json"
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: apps/site/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
